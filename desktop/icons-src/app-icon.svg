<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon: the Codekin mark on a dark ink plate (Big Sur grid: 824 px plate, 100 px margin). -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25282D"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#shadow)"/>
  <!-- Hairline edge so the plate separates from a dark Dock. -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <!-- Mark (24-unit grid, centred on the plate). -->
  <g transform="translate(176 151) scale(28)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#F5F6F7" stroke-width="2.4">
      <path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/>
      <path d="M8 20.1a9 9 0 0 1 -5 -7.1"/>
      <path d="M16 20.1a9 9 0 0 0 5 -7.1"/>
      <path d="M6.2 5a9 9 0 0 1 11.4 0"/>
    </g>
    <g fill="#FF6A2B">
      <circle cx="12" cy="12" r="1"/>
      <circle cx="12" cy="21" r="1.35"/>
      <circle cx="3" cy="9" r="1.35"/>
      <circle cx="21" cy="9" r="1.35"/>
    </g>
  </g>
</svg>
