[package]
name = "codekin-desktop"
version = "0.0.0" # the app version comes from the root package.json via tauri.conf.json (D4)
description = "Codekin desktop app"
edition = "2021"
publish = false

[lib]
name = "codekin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls + the platform verifier: hosted relays are https, and company relays
# may use a CA from the system keychain.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
command-fds = "0.3"
libc = "0.2"
url = "2"
sha2 = "0.10"
base64 = "0.23"
getrandom = "0.3"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

# The machine secret lives in the macOS Keychain (src/secrets.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
