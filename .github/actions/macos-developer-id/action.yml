name: Import Developer ID certificate
description: >
  Imports the Developer ID Application certificate into a throwaway keychain and
  exports its identity as APPLE_SIGNING_IDENTITY (read by `tauri build`) and
  CODEKIN_CODESIGN_IDENTITY (read by desktop/scripts/bundle-server.mjs).
inputs:
  certificate:
    description: Base64 of the .p12 export (secret APPLE_CERTIFICATE)
    required: true
  password:
    description: The .p12 password (secret APPLE_CERTIFICATE_PASSWORD)
    required: true
  team-id:
    description: The 10-character Apple Team ID (secret APPLE_TEAM_ID)
    required: true
outputs:
  identity:
    description: "The signing identity, e.g. Developer ID Application: Multiplier Labs (ABCDE12345)"
    value: ${{ steps.import.outputs.identity }}
runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        CERT_B64: ${{ inputs.certificate }}
        CERT_PASSWORD: ${{ inputs.password }}
        TEAM_ID: ${{ inputs.team-id }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/codekin-signing.keychain-db"
        KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
        CERT="$RUNNER_TEMP/developer-id.p12"
        printf '%s' "$CERT_B64" | base64 --decode > "$CERT"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$CERT"
        # Let codesign use the key without a UI prompt.
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
          | sed -n 's/.*"\(Developer ID Application: .* ('"$TEAM_ID"')\)".*/\1/p' | head -1)
        if [ -z "$IDENTITY" ]; then
          echo "::error::No 'Developer ID Application: … ($TEAM_ID)' identity in APPLE_CERTIFICATE. Check that the .p12 holds a Developer ID Application certificate with its private key, for this team."
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          exit 1
        fi
        echo "Signing as: $IDENTITY"
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
        echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "CODEKIN_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
