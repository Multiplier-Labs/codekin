name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Before the build: `npm run build` runs `tsc -b`, which also typechecks
      # the server project, and the relay needs server-only packages
      # (express-session, @simplewebauthn/server). Matches ci.yml.
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build frontend
        run: npm run build

      - name: Compile server TypeScript
        run: npx tsc -p server/tsconfig.json

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Desktop app (docs/DESKTOP-APP-TAURI-PLAN.md, Phase 3a): an unsigned
  # (ad-hoc signed) Apple Silicon build, published as a prerelease on the tag,
  # plus the updater artifacts. The updater manifest goes last, onto the
  # rolling `desktop-channel` prerelease, and only once everything it points
  # at is downloadable. Developer ID signing and notarization come in Phase 3b.
  desktop:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - name: Check the updater key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set (see desktop/README.md)"; exit 1; }
          node -e "if (!require('./desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey) { console.error('::error::plugins.updater.pubkey is empty in tauri.conf.json'); process.exit(1) }"

      # Phase 3b: Developer ID signing and notarization switch on once all six
      # Apple secrets exist (desktop/README.md). None: an ad-hoc build, as before.
      # Some but not all: fail, rather than quietly ship an unsigned build.
      - name: Check the Apple signing configuration
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash desktop/scripts/apple-signing-config.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cache pinned Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.cache
          key: node-runtime-darwin-arm64-${{ hashFiles('desktop/node-runtime.json') }}

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix desktop

      - name: Build frontend and server
        run: |
          npm run build
          npx tsc -p server/tsconfig.json

      - name: Import the Developer ID certificate
        if: steps.apple.outputs.signed == 'true'
        uses: ./.github/actions/macos-developer-id
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      # `tauri build` notarizes and staples the .app when these are set.
      - name: Provide the notarization key
        if: steps.apple.outputs.signed == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Bundle server payload and smoke test
        run: node desktop/scripts/bundle-server.mjs

      - name: Build Codekin.app, .dmg and updater artifacts
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # tauri.conf.json signs ad-hoc ("-"); a configured Developer ID replaces it.
          CONFIG=$(node -e '
            const c = { build: { beforeBuildCommand: "" }, bundle: { createUpdaterArtifacts: true } }
            if (process.env.APPLE_SIGNING_IDENTITY) c.bundle.macOS = { signingIdentity: process.env.APPLE_SIGNING_IDENTITY }
            console.log(JSON.stringify(c))')
          npx tauri build --bundles app,dmg --config "$CONFIG"

      - name: Sign, notarize and staple the .dmg
        if: steps.apple.outputs.signed == 'true'
        run: |
          set -euo pipefail
          DMG=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"

      # Every piece that runs code must carry our Team ID: the hardened runtime
      # refuses to load anything else (see #777), and Gatekeeper must accept
      # the app and the .dmg as notarized.
      - name: Verify signing and notarization
        if: steps.apple.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          B=desktop/src-tauri/target/release/bundle
          APP="$B/macos/Codekin.app"
          DMG=$(ls "$B"/dmg/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$APP"
          for f in "$APP/Contents/MacOS/"* $(find "$APP/Contents/Resources" -name '*.node'); do
            codesign -dv --verbose=2 "$f" 2>&1 | tee "$RUNNER_TEMP/sig.txt" >/dev/null
            grep -q "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/sig.txt" || { echo "::error::$f is not signed by team $APPLE_TEAM_ID"; cat "$RUNNER_TEMP/sig.txt"; exit 1; }
            grep -q "flags=.*runtime" "$RUNNER_TEMP/sig.txt" || { echo "::error::$f lacks the hardened runtime"; exit 1; }
          done
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=2 "$APP" 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG" 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"

      - name: Collect release files
        id: files
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          B=desktop/src-tauri/target/release/bundle
          cp "$B/macos/Codekin.app.tar.gz" "$OUT/Codekin_${VERSION}_aarch64.app.tar.gz"
          cp "$B/macos/Codekin.app.tar.gz.sig" "$OUT/Codekin_${VERSION}_aarch64.app.tar.gz.sig"
          cp "$B"/dmg/*.dmg "$OUT/Codekin_${VERSION}_aarch64.dmg"
          ls -la "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish the release files
        run: |
          set -euo pipefail
          if [ "${{ steps.apple.outputs.signed }}" = "true" ]; then
            NOTES="Codekin desktop app for Apple Silicon, signed with Developer ID and notarized by Apple."
          else
            NOTES="Unsigned internal build of the Codekin desktop app for Apple Silicon (ad-hoc signed, not notarized). After copying Codekin.app to Applications, run: xattr -dr com.apple.quarantine /Applications/Codekin.app"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --verify-tag --title "Codekin $TAG" --notes "$NOTES"
          gh release upload "$TAG" "${{ steps.files.outputs.dir }}"/* --clobber

      - name: Publish the updater manifest
        run: |
          set -euo pipefail
          V="${{ steps.files.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Codekin_${V}_aarch64.app.tar.gz"
          # Only point the updater at an artifact that is really there.
          curl -fsSIL "$URL" -o /dev/null
          node desktop/scripts/update-manifest.mjs --version "$V" \
            --signature-file "${{ steps.files.outputs.dir }}/Codekin_${V}_aarch64.app.tar.gz.sig" \
            --url "$URL" --notes "Codekin $TAG" --out "$RUNNER_TEMP/latest.json"
          gh release view desktop-channel >/dev/null 2>&1 || gh release create desktop-channel --prerelease \
            --title "Desktop update channel" --notes "Holds latest.json for the desktop app's updater. Not a release; see the v* releases."
          gh release upload desktop-channel "$RUNNER_TEMP/latest.json" --clobber
