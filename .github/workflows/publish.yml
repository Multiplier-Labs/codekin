name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Before the build: `npm run build` runs `tsc -b`, which also typechecks
      # the server project, and the relay needs server-only packages
      # (express-session, @simplewebauthn/server). Matches ci.yml.
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build frontend
        run: npm run build

      - name: Compile server TypeScript
        run: npx tsc -p server/tsconfig.json

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
