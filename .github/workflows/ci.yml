name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          cd server && npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The web app is served with a strict CSP (no inline script, no
      # third-party origins); fail here rather than in a browser.
      - name: Check builds against the CSP
        if: matrix.node-version == 24
        run: |
          VITE_APP_MODE=hosted npx vite build --outDir dist-hosted
          npm run check:csp

      - name: Test
        run: npm test
