name: Desktop

# Checks for the desktop app's own code. The app itself is built for real only
# when a release is tagged (the `desktop` job in publish.yml, next to the npm
# publish), not on every merge. This workflow runs on PRs that change the app
# (desktop/** or this file) and on demand (Actions → Desktop → Run workflow):
# the payload build and its smoke test on macos-15 and ubuntu, and the `shell`
# job (Rust checks, one unsigned .app build and its launch test).
#
# The release-path checks (the .dmg, a throwaway-key updater build, the real
# signing key) and the downloadable zipped .app run only on manual runs: worth
# one run before tagging. The .dmg and updater files for users are built only
# by the release job.
#
# Server / frontend changes don't trigger it. The release job runs the same
# payload smoke test before publishing anything, so a server change that
# breaks the app fails the desktop release (the npm publish is a separate job).

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  payload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            arch: arm64
          - runner: ubuntu-latest
            target: linux-x64
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Check runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" || { echo "Expected ${{ matrix.arch }}, got $(uname -m)"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Build frontend and server
        run: |
          npm run build
          npx tsc -p server/tsconfig.json

      - name: Cache pinned Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.cache
          key: node-runtime-${{ matrix.target }}-${{ hashFiles('desktop/node-runtime.json') }}

      - name: Bundle server payload and smoke test
        run: node desktop/scripts/bundle-server.mjs --target ${{ matrix.target }}

  shell:
    # The Tauri shell: Rust checks, an unsigned .app, and a real launch on Apple Silicon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check runner architecture
        run: test "$(uname -m)" = "arm64"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cache pinned Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.cache
          key: node-runtime-darwin-arm64-${{ hashFiles('desktop/node-runtime.json') }}

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix desktop

      - name: Build frontend and server
        run: |
          npm run build
          npx tsc -p server/tsconfig.json

      # tauri-build needs the sidecar and payload to exist, even for cargo check.
      - name: Bundle server payload and smoke test
        run: node desktop/scripts/bundle-server.mjs

      - name: Rust format, lint and tests
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build Codekin.app (unsigned, ad-hoc signed; plus the .dmg on manual runs)
        working-directory: desktop
        run: npx tauri build --bundles ${{ github.event_name == 'workflow_dispatch' && 'app,dmg' || 'app' }} --config '{"build":{"beforeBuildCommand":""}}'

      - name: Check the bundle
        id: bundle
        run: |
          APP=desktop/src-tauri/target/release/bundle/macos/Codekin.app
          test -d "$APP"
          ls -la "$APP/Contents/MacOS"
          test -x "$APP/Contents/MacOS/node"
          test -f "$APP/Contents/Resources/codekin/bin/codekin.mjs"
          # better-sqlite3 13+ ships Node-API prebuilds as prebuilds/<platform>-<arch>.node.
          test -f "$APP/Contents/Resources/codekin/node_modules/better-sqlite3/prebuilds/$("$APP/Contents/MacOS/node" -p 'process.platform + "-" + process.arch').node"
          # npm prebuilds carry their publisher's Team ID; the hardened-runtime Node refuses
          # to load them (CI runners don't enforce this, real Macs do), so they ship ad-hoc.
          ADDON="$APP/Contents/Resources/codekin/node_modules/better-sqlite3/prebuilds/darwin-arm64.node"
          codesign -dv "$ADDON" 2>&1 | tee "$RUNNER_TEMP/addon-sig.txt"
          grep -q "Signature=adhoc" "$RUNNER_TEMP/addon-sig.txt"
          grep -q "TeamIdentifier=not set" "$RUNNER_TEMP/addon-sig.txt"
          test "$(ls "$APP/Contents/Resources/codekin/node_modules/better-sqlite3/prebuilds")" = "darwin-arm64.node"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ls desktop/src-tauri/target/release/bundle/dmg/*.dmg; fi
          "$APP/Contents/MacOS/node" -p 'process.version + " " + process.arch'
          codesign -dv "$APP" 2>&1 | head -5
          # App Nap opt-out (Phase 2) must be in the bundle's Info.plist.
          test "$(plutil -extract NSAppSleepDisabled raw "$APP/Contents/Info.plist")" = "true"
          BIN=$(find "$APP/Contents/MacOS" -type f -perm +111 ! -name node | head -1)
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # Launch the real app with a throwaway HOME, wait for its server, take a
      # screenshot, then kill the shell and check the launcher shuts the server
      # down through the stdin lifetime pipe.
      - name: Launch smoke test
        run: |
          set -euo pipefail
          HOME_DIR="$RUNNER_TEMP/app-home"
          mkdir -p "$HOME_DIR/.config/codekin" "$HOME_DIR/repos"
          PORT=$(node -e "const s=require('net').createServer().listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          printf 'PORT=%s\nDATA_DIR=%s\nREPOS_ROOT=%s\n' "$PORT" "$HOME_DIR/data" "$HOME_DIR/repos" > "$HOME_DIR/.config/codekin/env"
          # Keep Mac awake saved as on: the app should hold a caffeinate tied to its pid.
          PREFS_DIR="$HOME_DIR/Library/Application Support/ai.codekin.desktop"
          mkdir -p "$PREFS_DIR"
          echo '{"keepAwake": true}' > "$PREFS_DIR/prefs.json"
          # The build output isn't in /Applications: skip the move prompt; no update checks in CI.
          HOME="$HOME_DIR" CODEKIN_SKIP_MOVE_CHECK=1 CODEKIN_DISABLE_UPDATES=1 "${{ steps.bundle.outputs.bin }}" > "$RUNNER_TEMP/app.out" 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do curl -sf -m 1 "http://127.0.0.1:$PORT/api/ping" && break; sleep 1; done
          curl -sf -m 2 "http://127.0.0.1:$PORT/api/ping"
          test -f "$HOME_DIR/data/.codekin-owner.sqlite"
          sleep 8
          screencapture -x "$RUNNER_TEMP/codekin-app.png" || echo "screencapture unavailable"
          LAUNCHER=$(pgrep -f "Codekin.app/Contents/MacOS/node .*app-server" | head -1)
          CAFFEINATE=$(pgrep -f "caffeinate -i -w $APP_PID" | head -1)
          echo "app=$APP_PID launcher=$LAUNCHER caffeinate=$CAFFEINATE"
          test -n "$CAFFEINATE"
          pmset -g assertions | grep -i "caffeinate" | head -3 || true
          kill -9 "$APP_PID"
          for i in $(seq 1 30); do kill -0 "$LAUNCHER" 2>/dev/null || break; sleep 1; done
          if kill -0 "$LAUNCHER" 2>/dev/null; then echo "launcher did not stop after the shell died"; exit 1; fi
          if curl -sf -m 1 "http://127.0.0.1:$PORT/api/ping"; then echo "server still up"; exit 1; fi
          grep -q "stdin closed" "$HOME_DIR/Library/Logs/Codekin/server.log"
          # caffeinate -w ends with the app, so a crash never leaves the Mac held awake.
          for i in $(seq 1 10); do kill -0 "$CAFFEINATE" 2>/dev/null || break; sleep 1; done
          if kill -0 "$CAFFEINATE" 2>/dev/null; then echo "caffeinate outlived the app"; exit 1; fi
          echo "launch smoke test passed"

      - name: Server log
        if: always()
        run: |
          cat "$RUNNER_TEMP/app.out" || true
          tail -50 "$RUNNER_TEMP/app-home/Library/Logs/Codekin/server.log" || true

      - name: Zip the app
        if: github.event_name == 'workflow_dispatch'
        run: ditto -c -k --keepParent "${{ steps.bundle.outputs.app }}" "$RUNNER_TEMP/Codekin-unsigned-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: codekin-desktop-unsigned
          path: |
            ${{ runner.temp }}/Codekin-unsigned-arm64.zip
            ${{ runner.temp }}/codekin-app.png
          if-no-files-found: warn
          retention-days: 7

      # The real release key (repository secrets) must match the committed public
      # key and its password must work, or the first release fails. Sign a file
      # and verify it with minisign; skipped where secrets aren't available (forks).
      - name: Check the release signing key
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "No signing key secret here; skipping."; exit 0; fi
          brew install minisign >/dev/null
          T="$RUNNER_TEMP/keycheck"; mkdir -p "$T"
          echo "codekin release key check $GITHUB_SHA" > "$T/probe.txt"
          npx tauri signer sign "$T/probe.txt"
          node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" | base64 -d > "$T/codekin.pub"
          base64 -d < "$T/probe.txt.sig" > "$T/probe.txt.minisig"
          minisign -V -p "$T/codekin.pub" -m "$T/probe.txt" -x "$T/probe.txt.minisig"
          rm -rf "$T"

      # The release job's updater path, with a throwaway key: signed
      # .app.tar.gz + .sig carrying the version, and a valid latest.json.
      - name: Updater artifacts with a throwaway key
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: |
          set -euo pipefail
          npx tauri signer generate --ci -p "" -w "$RUNNER_TEMP/ci-updater.key"
          PUB=$(cat "$RUNNER_TEMP/ci-updater.key.pub")
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/ci-updater.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            npx tauri build --bundles app --config "{\"build\":{\"beforeBuildCommand\":\"\"},\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$PUB\"}}}"
          B=src-tauri/target/release/bundle/macos
          ls -la "$B"
          test -s "$B/Codekin.app.tar.gz"
          test -s "$B/Codekin.app.tar.gz.sig"
          VERSION=$(node -p "require('../package.json').version")
          # requireSignedVersion: the signature's trusted comment must name the version.
          base64 -d < "$B/Codekin.app.tar.gz.sig" | tee /dev/stderr | grep -q "$VERSION"
          node scripts/update-manifest.mjs --version "$VERSION" --signature-file "$B/Codekin.app.tar.gz.sig" \
            --url "https://github.com/Multiplier-Labs/codekin/releases/download/v$VERSION/Codekin_${VERSION}_aarch64.app.tar.gz" \
            --out "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          rm -f "$RUNNER_TEMP/ci-updater.key"
