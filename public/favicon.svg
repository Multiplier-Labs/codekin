<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .ring { stroke: #16181B; }
    .dot { fill: #FF6A2B; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #F5F6F7; }
    }
  </style>
  <!-- Center nucleus ring -->
  <path class="ring" d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
  <!-- Inner core -->
  <circle class="dot" cx="12" cy="12" r="0.9" />
  <!-- Orbital arcs -->
  <path class="ring" d="M8 20.1a9 9 0 0 1 -5 -7.1" />
  <path class="ring" d="M16 20.1a9 9 0 0 0 5 -7.1" />
  <path class="ring" d="M6.2 5a9 9 0 0 1 11.4 0" />
  <!-- Orbital endpoint dots -->
  <circle class="dot" cx="12" cy="21" r="1.2" />
  <circle class="dot" cx="3" cy="9" r="1.2" />
  <circle class="dot" cx="21" cy="9" r="1.2" />
</svg>
